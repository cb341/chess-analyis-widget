services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: chess_analysis_production
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data

  analysis-app:
    build:
      context: ./analysis-app
    platform: linux/amd64
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      RAILS_ENV: production
      SECRET_KEY_BASE: production-placeholder-change-me
      POSTGRES_HOST: db
      POSTGRES_DB: chess_analysis_production
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      STOCKFISH_PATH: /usr/local/bin/stockfish
      STOCKFISH_DEPTH: 10
      STOCKFISH_TIMEOUT: 2.0
    depends_on:
      - db
    ports:
      - "3000:3000"
    command: bash -lc "bundle exec rails db:prepare && bundle exec rails server -b 0.0.0.0"

volumes:
  postgres-data:
